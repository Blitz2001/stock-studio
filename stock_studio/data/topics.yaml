# South Asian subjects that are still undersupplied on stock sites. Real photos win here:
# AI can't fake real places, and buyers want authenticity.
underserved:
  - topic: sri lankan tea plantations and tea pluckers
    shots: [tea pluckers at work in Nuwara Eliya (with model releases), rows of tea bushes in mist, freshly plucked leaves in a basket, tea factory machinery]
    lanes: [my_photos]
  - topic: sri lankan food
    shots: [rice and curry spread on a banana leaf, hoppers and pol sambol, kottu being chopped at a street stall, string hoppers breakfast, king coconut stall]
    lanes: [my_photos]
  - topic: sri lankan everyday life
    shots: [tuk-tuk traffic in Pettah, fish market at Negombo, bus stand rush hour, village well, paddy field harvest]
    lanes: [my_photos]
  - topic: south asian business people
    shots: [south asian team meeting in a modern office, female engineer on a construction site, startup founders brainstorming]
    lanes: [ai_images, my_photos]
  - topic: south asian families and homes
    shots: [multi-generational family meal, grandparents with grandchildren, family using a smartphone together]
    lanes: [ai_images, my_photos]
  - topic: sri lankan architecture and heritage
    shots: [colonial buildings in Galle Fort, dagoba against blue sky (no flash, respectful framing), Kandyan roof details, tropical modernist houses]
    lanes: [my_photos]
  - topic: sri lankan nature and wildlife
    shots: [elephants at a reservoir, peacock in dry zone forest, mangroves, monsoon rain on leaves]
    lanes: [my_photos]
  - topic: south asian textile and craft patterns
    shots: [batik-inspired seamless pattern, handloom weave texture, lacquer-work motifs, kolam geometric pattern]
    lanes: [code_vectors, my_photos]
  - topic: south asian festivals and rituals
    shots: [temple offerings, oil lamp lighting, traditional drummers]
    lanes: [my_photos]
  - topic: agriculture and farming in south asia
    shots: [paddy transplanting, farmer with smartphone, coconut harvesting, cinnamon peeling]
    lanes: [my_photos]
