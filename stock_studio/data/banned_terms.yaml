# Terms that must never appear in a generation prompt, title or keyword.
# Adobe Stock's generative AI rules ban artist names, real people, brands and copyrighted
# works in prompts, titles and keywords. This list is a starting point, not a complete one:
# add names as you meet them (local brands, celebrities, characters).
#
# Matching is case-, accent- and punctuation-insensitive, handles possessives/plurals
# ("Nike's", "Nikes") and joined spellings ("cocacola"), but only on whole words, so
# "pineapple" never matches "apple".

block:
