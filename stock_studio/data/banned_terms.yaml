# Phrases that signal style-copying or tool-name stuffing (regex on normalised, lower-case text).
patterns:
  - '\bin the style of\b'
  - '\bin the manner of\b'
  - '\binspired by the work of\b'
  - '\b(art|artwork) by [a-z]+'
  - '\bby (the )?artist\b'
  - '\btrending on\b'
