# Seasonal demand calendar. Buyers search 1-3 months before an event, so the scout
# suggests topics whose date falls 30-120 days ahead (see config.yaml -> scout).
#
# Fixed dates: month + day. Lunar/movable dates: approx: true; the scout labels them
# "confirm date" (Vesak, Poson, Eid, Diwali, Holi, Easter move every year).
# region: global | sri_lanka | south_asia  (sri_lanka/south_asia get a supply-gap bonus)

events:
  - name: New Year
    month: 1
    day: 1
    region: global
    shots: [fireworks over a city skyline, new year resolution notebook flat lay, countdown party with friends, 2027 calendar planning desk]
    lanes: [my_photos, code_vectors, ai_images]
  - name: Thai Pongal
    month: 1
    day: 14
    region: sri_lanka
    shots: [pongal pot boiling over with milk rice, kolam rice-flour patterns at a doorway, sugarcane and turmeric offerings, family sharing sweet pongal]
    lanes: [my_photos, code_vectors]
  - name: Lunar New Year
    month: 2
    day: 1
    approx: true
    region: global
    shots: [red envelopes on a table, lanterns pattern, family reunion dinner]
    lanes: [code_vectors, ai_images]
